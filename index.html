<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Rajlakshmi Javiks International | Organic & Natural Products</title>

    <meta
      name="description"
      content="Rajlakshmi Javiks International offers premium organic and natural products with certified quality, trusted globally."
    />

    <meta
      name="keywords"
      content="organic products, javik products, natural food, rajlakshmi javiks international"
    />

    <meta name="author" content="Rajlakshmi Javiks International" />

    <!-- Canonical tag is managed dynamically via React Helmet in Seo.tsx -->

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Theme -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Prevent white flash / blinking on load -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #f9f6f0;
      }
      #root {
        min-height: 100vh;
        background: #f9f6f0;
      }
    </style>

    <!-- Open Graph -->
    <meta property="og:title" content="Rajlakshmi Javiks International" />
    <meta
      property="og:description"
      content="Premium organic and natural products from Rajlakshmi Javiks International."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://rajlakshmijaviksinternational.com/"
    />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rajlakshmi Javiks International" />
    <meta
      name="twitter:description"
      content="Premium organic and natural products."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- PERFORMANCE OPTIMIZATION -->

    <!-- Preconnect important origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://ik.imagekit.io" crossorigin />

    <!-- Preload hero image (LCP improvement) -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/banner-main-page/newbanner-12.jpeg"
      fetchpriority="high"
    />

    <!-- Google Fonts optimized -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />

    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Google Analytics (deferred until idle) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }

      // Defer GA loading until browser is idle
      (function() {
        function loadGA() {
          var s = document.createElement('script');
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-B6M3DSVNX7';
          s.async = true;
          document.head.appendChild(s);
          gtag('js', new Date());
          gtag('config', 'G-B6M3DSVNX7', { anonymize_ip: true });
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadGA, { timeout: 3000 });
        } else {
          setTimeout(loadGA, 2000);
        }
      })();
    </script>
  </head>

  <body>
    <!-- React Root -->
    <div id="root"></div>

    <!-- React Entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
